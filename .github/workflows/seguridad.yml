# Auditoría de seguridad: en cada cambio, en cada propuesta de cambio (pull request) y cada lunes.
# Revisa secretos en todo el historial, vulnerabilidades en dependencias y el sitio construido.
# El informe queda en el resumen de la ejecución (pestaña Actions).
name: Auditoría de seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # lunes 7:00 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Descargar gitleaks 8.30.1 y verificar su firma SHA-256
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Buscar claves, tokens y contraseñas en todos los commits
        run: ./gitleaks git . --redact --no-banner --verbose

  dependencias:
    name: Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades conocidas (npm audit con excepciones justificadas)
        run: node scripts/auditar-dependencias.mjs
      - name: Firmas de los paquetes descargados (procedencia en el registro de npm)
        run: npm audit signatures

  sitio:
    name: Sitio publicado y repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CSP, secretos, datos personales, recursos externos y metadatos de fotos
        run: node scripts/auditar-seguridad.mjs --informe
