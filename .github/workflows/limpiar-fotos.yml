# Cuando alguien sube fotos, les quita los metadatos (ubicación GPS, modelo de cámara, fecha)
# y guarda la versión limpia en el repositorio. El sitio ya publica fotos limpias; esto protege
# también los archivos originales, que son visibles en GitHub.
name: Limpiar fotos

on:
  push:
    branches: [main]
    paths: ['src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.png', 'public/**/*.webp', 'src/**/*.JPG', 'src/**/*.JPEG', 'src/**/*.PNG']

permissions:
  contents: write

concurrency:
  group: limpiar-fotos

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run limpiar-fotos
      - name: Guardar las fotos limpias
        run: |
          if git diff --quiet; then echo "Las fotos no tenían metadatos."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Quitar metadatos de fotos (ubicación y cámara)"
          git pull --rebase && git push
