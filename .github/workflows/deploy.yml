# Publica el blog en GitHub Pages cada vez que hay cambios en la rama main
# (por ejemplo, cuando un becario sube una crónica nueva desde la web de GitHub).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Quitar metadatos de las fotos (ubicación, cámara) antes de publicarlas
        run: npm run limpiar-fotos

      - name: Revisar vulnerabilidades en dependencias
        run: node scripts/auditar-dependencias.mjs

      - name: Verificar, construir y auditar seguridad (CSP, secretos, datos personales, recursos externos)
        run: npm run verificar

      - name: Preparar el sitio para Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
